# ov keybindings — less/vim-compatible map, copied from upstream ov-less.yaml
# https://github.com/noborus/ov/blob/master/ov-less.yaml
# Only KeyBind is overridden; General/Style keep ov defaults.
KeyBind:
    align_format:
        - "ctrl+alt+f"
    alter_rows_mode:
        - "C"
    backsearch:
        - "?"
    begin_left:
        - "shift+Home"
    bottom:
        - "End"
        - ">"
        - "G"
    cancel:
        - "ctrl+c"
    close_all_filter:
        - "ctrl+alt+k"
    close_doc:
        - "alt+k"
    close_file:
        - "ctrl+F9"
        - "ctrl+alt+s"
    column_mode:
        - "c"
    column_width:
        - "alt+o"
    convert_type:
        - "ctrl+alt+t"
    delimiter:
        - "F8"
    down:
        - "e"
        - "ctrl+e"
        - "j"
        - "J"
        - "ctrl+j"
        - "Enter"
        - "Down"
    edit:
        - "v"
    end_right:
        - "shift+End"
    exit:
        - "Escape"
        - "q"
    filter:
        - "&"
    fixed_column:
        - "alt+f"
    follow_all:
        - "ctrl+a"
    follow_mode:
        - "F"
    follow_section:
        - "F2"
    goto:
        - ":"
    half_left:
        - "ctrl+left"
    half_right:
        - "ctrl+right"
    header:
        - "H"
    header_column:
        - "ctrl+alt+d"
    help:
        - "h"
        - "ctrl+alt+c"
    hide_other:
        - "alt+-"
    input_casesensitive:
        - "alt+c"
    input_copy:
        - "ctrl+c"
    input_incsearch:
        - "alt+i"
    input_next:
        - "Down"
    input_non_match:
        - "!"
    input_paste:
        - "ctrl+v"
    input_previous:
        - "Up"
    input_regexp_search:
        - "alt+r"
    input_smart_casesensitive:
        - "alt+s"
    jump_target:
        - "alt+j"
    last_section:
        - "9"
    left:
        - "left"
    line_number_mode:
        - "alt+n"
    logdoc:
        - "ctrl+alt+e"
    mark:
        - "m"
    mark_by_pattern:
        - "*"
    mark_number:
        - ","
    multi_color:
        - "."
    next_backsearch:
        - "N"
    next_doc:
        - "]"
    next_mark:
        - "alt+>"
    next_search:
        - "n"
    next_section:
        - "space"
    page_down:
        - "PageDown"
        - "ctrl+v"
        - "alt+space"
        - "f"
        - "z"
    page_half_down:
        - "d"
        - "ctrl+d"
    page_half_up:
        - "u"
        - "ctrl+u"
    page_up:
        - "PageUp"
        - "b"
        - "alt+v"
    plain_mode:
        - "ctrl+F7"
    previous_doc:
        - "["
    previous_mark:
        - "alt+<"
    previous_section:
        - "^"
    rainbow_mode:
        - "ctrl+F4"
    raw_format:
        - "ctrl+alt+g"
    reload:
        - "R"
        - "ctrl+r"
    remove_all_mark:
        - "ctrl+delete"
    remove_mark:
        - "M"
    right:
        - "right"
    right_align:
        - "alt+a"
    save_buffer:
        - "s"
    search:
        - "/"
    section_delimiter:
        - "alt+d"
    section_header_num:
        - "F7"
    section_start:
        - "ctrl+F3"
        - "alt+s"
    set_view_mode:
        - "p"
        - "P"
    set_write_exit:
        - "ctrl+q"
    shrink_column:
        - "alt+x"
    sidebar_doc_list:
        - "alt+l"
    sidebar_down:
        - "shift+Down"
    sidebar_help:
        - "alt+h"
    sidebar_left:
        - "shift+Left"
    sidebar_marks:
        - "alt+m"
    sidebar_right:
        - "shift+Right"
    sidebar_sections:
        - "alt+u"
    sidebar_up:
        - "shift+Up"
    skip_lines:
        - "ctrl+s"
    status_line:
        - "ctrl+F10"
    suspend:
        - "ctrl+z"
    sync:
        - "r"
        - "ctrl+l"
    tabwidth:
        - "t"
    toggle_mouse:
        - "ctrl+F8"
        - "ctrl+alt+r"
    toggle_ruler:
        - "alt+shift+F9"
    top:
        - "Home"
        - "g"
        - "<"
    up:
        - "y"
        - "Y"
        - "ctrl+y"
        - "k"
        - "K"
        - "ctrl+k"
        - "Up"
    vertical_header:
        - "ctrl+alt+b"
    watch:
        - "T"
        - "ctrl+alt+w"
    watch_interval:
        - "ctrl+w"
    width_left:
        - "alt+left"
    width_right:
        - "alt+right"
    word_wrap_mode:
        - "alt+w"
    wrap_mode:
        - "w"
        - "W"
    write_exit:
        - "Q"
    write_original:
        - "alt+shift+F8"
